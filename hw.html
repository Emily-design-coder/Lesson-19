<!DOCTYPE html>
<html>

<head>
    <title>My page</title>
</head>

<body>
    <h1>Calculator</h1>
    <p id="add"></p>
    <p id="sub"></p>
    <p id="mul"></p>
    <p id="div"></p>
<script>
    var a, b, c, d, e, f;
    a = 10;
    b = 2;

    c = a + b;
    d = a - b;
    e = a * b;
    f = a / b;
    
    document.getElementById(add).innerHTML = "The added value is:" + c;
    document.getElementById(sub).innerHTML = "The subtracted value is:" + d;
    document.getElementById(mul).innerHTML = "The multiplied value is:" + e;
    document.getElementById(div).innerHTML = "The divided value is:" + f;
    
</script>
</body>

</html>

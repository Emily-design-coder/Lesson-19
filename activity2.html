<!DOCTYPE html>
<html>
    <head>
        <title>My page</title>
    </head>
    <body>
        <h1>Statements and operators</h1>
        <p id="p1"></p>
        <script>
            var x,y,z,i,j,k;
            x=7;
            y=10;
            i=15;
            j=2;
            k=9;
            z = (x+y)*i/j%k
            document.getElementById("p1").innerHTML = "Result of expression is " +z;
        </script>
    </body>
</html>
